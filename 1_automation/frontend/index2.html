<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Watchlist Manager</title>
    <style>
      form input {
        margin: 5px;
        padding: 6px;
      }
      form button {
        padding: 6px 12px;
        background-color: #2ecc71;
        color: white;
        border: none;
        cursor: pointer;
      }
      form button:hover {
        background-color: #27ae60;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f9f9f9;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th,
      td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: left;
      }
      th {
        background: #333;
        color: white;
      }
      button {
        padding: 6px 10px;
        margin: 2px;
        border: none;
        cursor: pointer;
      }
      .delete {
        background: #e74c3c;
        color: white;
      }
      .edit {
        background: #3498db;
        color: white;
      }
      .save {
        background: #2ecc71;
        color: white;
      }
      input[type="text"],
      input[type="number"] {
        width: 90%;
      }
      .row {
        margin: 20px;
        padding: 5px;
        border-radius: 10px;
        background-color: #27ae5f31;
        display: flex;
        align-items: center;
      }
    </style>
  </head>

    <div
      style="
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 20px;
        font-family: Arial, sans-serif;
      "
    >
      <!-- Left side: Watchlist title -->
      <h2 style="margin: 0">Watchlist</h2>

      <!-- Right side: User details and avatar -->
      <div
        style="

          padding: 10px;
          display: flex;
          justify-content: end;
          align-items: end;
          gap: 15px;
        "
      >
        <!-- User avatar (circle) -->

          style="
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
          "
        >
          U
        </div>

        <!-- User information -->
        <div>
          <h3 style="margin: 0">Name: <span id="name_user"> </span></h3>
          <h3 style="margin: 0">Email: <span id="email_user"> </span></h3>
        </div>
      </div>
      <button
        onclick="logout()"
        style="padding: 5px; border-radius: 20px; background-color: red"
        onmouseleave="this.style.backgroundColor='red'"
        onmouseover="this.style.backgroundColor='lightblue';"
      >
        Logout
      </button>
    </div>
    <div class="row">
      <h3>Add New Stock</h3>
      <button
        popovertargetaction="show"
        popovertarget="createForm"
        style="background-color: #2ecc71"
      >
        Create
      </button>
    </div>

    <form style="background-color: #d8bc92" popover="auto" id="createForm">
      <!-- <input type="text" name="id" placeholder="ID" required /> -->
      <div class="row">
        <span>Stock symbol name</span>
        <select
          required
          name="stock_symbol_name"
          id="stock_symbol_name"
        ></select>
      </div>

      <div class="row">
        <span>Per Unit cost</span>

        <input
          type="number"
          step="0.01"
          name="per_unit_cost"
          placeholder="Per Unit Cost"
          required
        />
      </div>
      <div class="row">
        <span>Total Units</span>

        <input type="number" name="units" placeholder="Units" required />
      </div>
      <div class="row">
        <span>Alert per unit price</span>
        <input
          type="number"
          step="0.01"
          name="alert_unit_price"
          placeholder="Alert Price unit"
          required
        />
      </div>
      <button type="submit">Add</button>
      <button
        type="button"
        onclick="document.getElementById('createForm').reset()"
      >
        Clear
      </button>
    </form>
    <br />

    <table id="watchlistTable">
      <thead>
        <tr>
          <th>WID</th>
          <th>ID</th>
          <th>Symbol</th>
          <th>Per Unit Cost</th>
          <th>Units</th>
          <th>Alert Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script type="module" src="main.js"></script>

    <script>
      async function logout() {
        try {
          const res = await fetch("/api/watchlist/logout", { method: "POST" });
          if (res.ok) {
            window.location.href = "/login";
          } else {
            alert("Logout failed");
          }
        } catch (err) {
          console.error(err);
          alert("Logout failed");
        }
      }

      async function loadWatchlist() {
        const res = await fetch("/api/watchlist/all");
        const data = await res.json();
        const tbody = document.querySelector("#watchlistTable tbody");
        tbody.innerHTML = "";

        data.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.wid}</td>
            <td>${row.id}</td>
            <td><input readonly type="text" value="${row.stock_symbol_name}" /></td>
            <td><input  type="number" value="${row.per_unit_cost}" /></td>
            <td><input  type="number" value="${row.units}" /></td>
            <td><input type="number" value="${row.alert_unit_price}" /></td>
            <td>
                <button class="save" onclick="updateRow(${row.wid}, this)">Save</button>
                <button class="delete" onclick="deleteRow(${row.wid})">Delete</button>
            </td>
        `;
          tbody.appendChild(tr);
        });
      }

      async function deleteRow(wid) {
        if (confirm(`Are you sure you want to delete WID ${wid}?`)) {
          await fetch(`/api/watchlist/${wid}`, { method: "DELETE" });
          loadWatchlist();
        }
      }
      async function loadUserInfo() {
        try {
          const res = await fetch("/api/watchlist/me"); // or /api/user/me if you use a separate router
          if (!res.ok) throw new Error("Failed to fetch user info");

          const user = await res.json();
          document.getElementById("name_user").textContent = user.name;
          document.getElementById("email_user").textContent = user.email;
        } catch (err) {
          console.error(err);
          document.getElementById("name_user").textContent = "Unknown";
          document.getElementById("email_user").textContent = "Unknown";
        }
      }

      async function updateRow(wid, btn) {
        const row = btn.closest("tr");
        const inputs = row.querySelectorAll("input");
        const [id, symbol, cost, units, alert] = Array.from(inputs).map(
          (input) => input.value
        );

        await fetch(`/api/watchlist/${wid}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id,
            stock_symbol_name: symbol,
            per_unit_cost: parseFloat(cost),
            units: parseInt(units),
            alert_unit_price: parseFloat(alert),
          }),
        });
        loadWatchlist();
      }

        .getElementById("createForm")

            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newStock),
          });
