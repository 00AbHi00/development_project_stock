<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Watchlist Manager</title>
    <style>
      form input {
        margin: 5px;
        padding: 6px;
      }
      form button {
        padding: 6px 12px;
        background-color: #2ecc71;
        color: white;
        border: none;
        cursor: pointer;
      }
      form button:hover {
        background-color: #27ae60;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f9f9f9;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th,
      td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: left;
      }
      th {
        background: #333;
        color: white;
      }
      button {
        padding: 6px 10px;
        margin: 2px;
        border: none;
        cursor: pointer;
      }
      .delete {
        background: #e74c3c;
        color: white;
      }
      .edit {
        background: #3498db;
        color: white;
      }
      .save {
        background: #2ecc71;
        color: white;
      }
      input[type="text"],
      input[type="number"] {
        width: 90%;
      }
      .row {
        margin: 20px;
        padding: 5px;
        border-radius: 10px;
        background-color: #27ae5f31;
        display: flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h2>Watchlist</h2>
    <h2>Add New Stock</h2>
    <button popovertargetaction="show" popovertarget="createForm" style="background-color: #2ecc71">
      Create
    </button>

    <form style="background-color: #d8bc92" popover="auto"  id="createForm">
      <!-- <input type="text" name="id" placeholder="ID" required /> -->
      <div class="row">
        <span>Stock symbol name</span>
        <select required name="stock_symbol_name">
          <option value="Nabil Bank Limited">Nabil Bank Limited</option>
          <option value="Nepal Investment Mega Bank Limited">
            Nepal Investment Mega Bank Limited
          </option>
          <option value="Standard Chartered Bank Limited">
            Standard Chartered Bank Limited
          </option>
          <option value="Himalayan Bank Limited">Himalayan Bank Limited</option>
          <option value="Nepal SBI Bank Limited">Nepal SBI Bank Limited</option>
          <option value="Everest Bank Limited">Everest Bank Limited</option>
          <option value="NIC Asia Bank Ltd.">NIC Asia Bank Ltd.</option>
        </select>
      </div>

      <div class="row">
        <span>Per Unit cost</span>

        <input
          type="number"
          step="0.01"
          name="per_unit_cost"
          placeholder="Per Unit Cost"
          required
        />
      </div>
      <div class="row">
        <span>Total Units</span>

        <input type="number" name="units" placeholder="Units" required />
      </div>
      <div class="row">
        <span>Alert per unit price</span>
        <input
          type="number"
          step="0.01"
          name="alert_unit_price"
          placeholder="Alert Price unit"
          required
        />
      </div>
      <button type="submit">Add</button>
     <button type="button" onclick="document.getElementById('createForm').reset()">Clear</button>

    </form>
    <br />

    <table id="watchlistTable">
      <thead>
        <tr>
          <th>WID</th>
          <th>ID</th>
          <th>Symbol</th>
          <th>Per Unit Cost</th>
          <th>Units</th>
          <th>Alert Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      async function loadWatchlist() {
        const res = await fetch("/api/watchlist");
        const data = await res.json();
        const tbody = document.querySelector("#watchlistTable tbody");
        tbody.innerHTML = "";

        data.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
                    <td>${row.wid}</td>
                    <td><input type="text" value="${row.id}" /></td>
                    <td><input type="text" value="${row.stock_symbol_name}" /></td>
                    <td><input type="number" value="${row.per_unit_cost}" /></td>
                    <td><input type="number" value="${row.units}" /></td>
                    <td><input type="number" value="${row.alert_unit_price}" /></td>
                    <td>
                        <button class="save" onclick="updateRow(${row.wid}, this)"> Save</button>
                        <button class="delete" onclick="deleteRow(${row.wid})">Delete</button>
                    </td>
                `;
          tbody.appendChild(tr);
        });
      }

      async function deleteRow(wid) {
        if (confirm(`Are you sure you want to delete WID ${wid}?`)) {
          await fetch(`/api/watchlist/${wid}`, { method: "DELETE" });
          loadWatchlist();
        }
      }

      async function updateRow(wid, btn) {
        const row = btn.closest("tr");
        const inputs = row.querySelectorAll("input");
        const [id, symbol, cost, units, alert] = Array.from(inputs).map(
          (input) => input.value
        );

        await fetch(`/api/watchlist/${wid}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id,
            stock_symbol_name: symbol,
            per_unit_cost: parseFloat(cost),
            units: parseInt(units),
            alert_unit_price: parseFloat(alert),
          }),
        });
        loadWatchlist();
      }

      document
        .getElementById("createForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const form = e.target;

          const newStock = {
            id: form.id.value,
            stock_symbol_name: form.stock_symbol_name.value,
            per_unit_cost: parseFloat(form.per_unit_cost.value),
            units: parseInt(form.units.value),
            alert_unit_price: parseFloat(form.alert_unit_price.value),
          };

          await fetch("/api/watchlist", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newStock),
          })

          form.reset(); // Clear form
          loadWatchlist(); // Refresh table
        });

      // Load on page start
      loadWatchlist();
    </script>
  </body>
</html>
