<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Watchlist Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #333;
            color: white;
        }
        button {
            padding: 6px 10px;
            margin: 2px;
            border: none;
            cursor: pointer;
        }
        .delete {
            background: #e74c3c;
            color: white;
        }
        .edit {
            background: #3498db;
            color: white;
        }
        .save {
            background: #2ecc71;
            color: white;
        }
        input[type="text"], input[type="number"] {
            width: 90%;
        }
    </style>
</head>
<body>
    <h2>📊 Watchlist</h2>
    <table id="watchlistTable">
        <thead>
            <tr>
                <th>WID</th>
                <th>ID</th>
                <th>Symbol</th>
                <th>Per Unit Cost</th>
                <th>Units</th>
                <th>Alert Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function loadWatchlist() {
            const res = await fetch('/api/watchlist');
            const data = await res.json();
            const tbody = document.querySelector('#watchlistTable tbody');
            tbody.innerHTML = '';

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.wid}</td>
                    <td><input type="text" value="${row.id}" /></td>
                    <td><input type="text" value="${row.stock_symbol_name}" /></td>
                    <td><input type="number" value="${row.per_unit_cost}" /></td>
                    <td><input type="number" value="${row.units}" /></td>
                    <td><input type="number" value="${row.alert_unit_price}" /></td>
                    <td>
                        <button class="save" onclick="updateRow(${row.wid}, this)">💾 Save</button>
                        <button class="delete" onclick="deleteRow(${row.wid})">🗑 Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteRow(wid) {
            if (confirm(`Are you sure you want to delete WID ${wid}?`)) {
                await fetch(`/api/watchlist/${wid}`, { method: 'DELETE' });
                loadWatchlist();
            }
        }

        async function updateRow(wid, btn) {
            const row = btn.closest('tr');
            const inputs = row.querySelectorAll('input');
            const [id, symbol, cost, units, alert] = Array.from(inputs).map(input => input.value);

            await fetch(`/api/watchlist/${wid}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id,
                    stock_symbol_name: symbol,
                    per_unit_cost: parseFloat(cost),
                    units: parseInt(units),
                    alert_unit_price: parseFloat(alert)
                })
            });
            loadWatchlist();
        }

        // Load on page start
        loadWatchlist();
    </script>
</body>
</html>
